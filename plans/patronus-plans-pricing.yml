description: >-
  Patronus AI offers a free trial with limited evaluator calls and paid tiers (Team, Enterprise) with
  higher quotas, custom evaluators, and SSO. Self-serve pricing for paid tiers is not consistently
  published; most paid usage is sales-led.
notes: Free trial + sales-led paid tiers. Exact paid pricing is contact-sales.
sources:
- https://www.patronus.ai/pricing
- https://docs.patronus.ai/
plans:
- id: patronus-free
  name: Free Trial
  type: free
  description: Free tier with limited evaluator calls per month for individuals.
  entries:
  - label: Free Tier
    name: free
    type: flat
    metric: month
    limit: -1
    timeFrame: monthly
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
  elements:
  - name: Limited monthly evaluator calls
- id: patronus-team-enterprise
  name: Team / Enterprise
  type: enterprise
  description: Paid tiers with higher evaluator quotas, custom evaluators, SSO, and on-prem options.
  entries:
  - label: Subscription
    name: subscription
    type: flat
    metric: month
    limit: -1
    timeFrame: monthly
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: true
  elements:
  - name: Custom evaluators
  - name: SSO
  - name: Higher quotas
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com

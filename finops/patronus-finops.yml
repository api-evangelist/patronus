description: >-
  FOCUS-aligned FinOps profile for Patronus AI. Cost is metered evaluator calls plus seat-based
  subscription. Optimize by sampling production traffic, batching evaluator runs, and consolidating
  around the strongest evaluators (Lynx for hallucination, Glider for general critique).
notes: Seat + metered evaluator calls; sampling is the primary lever.

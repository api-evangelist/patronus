specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Patronus AI
providerId: patronus
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- AI Evaluation
- GenAI
- Guardrails
- Hallucination Detection
- LLM
- Agents
- Rate Limiting
- Quotas
- Throttling
description: >-
  Patronus AI applies per-API-key rate limits and tier-based monthly quotas. Specific RPS thresholds
  are not publicly documented; the API returns 429 on overage.
notes: Per-tier monthly quotas; specific RPS not publicly documented.
sources:
- https://docs.patronus.ai/
responseCodes:
  throttled: 429
limits:
- name: Per API key
  scope: account
  metric: requests
  limit: see provider documentation
  notes: Throttled with 429 on overage.
- name: Monthly evaluator calls
  scope: account
  metric: calls
  limit: tier-defined
  notes: Each tier has a monthly quota.
policies:
- name: Backoff Strategy
  description: Honor 429 with exponential backoff.
- name: Caching
  description: Cache evaluator results when scoring identical inputs.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com

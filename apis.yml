name: Patronus AI
kind: company
description: >-
  Patronus AI is an AI evaluation platform offering automated evaluators (Lynx, Glider), guardrails,
  and experiment tracking for LLM and agentic applications. It exposes a REST API and
  Python/TypeScript SDKs.
